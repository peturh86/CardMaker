version: "3.8"
services:
  cardmaker:
    build: .
    ports:
      - "8000:8000"
      - "631:631"
    env_file: .env
    volumes:
      - ./app:/app/app
      - ./printer:/printer
      # Persist the ~176 MB rembg u2net model so it is downloaded once rather
      # than on every container recreate. Runs as root, so HOME is /root.
      - u2net-cache:/root/.u2net

volumes:
  u2net-cache:
